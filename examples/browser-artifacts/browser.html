<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDK streaming artifact verification</title>
<style>body{font:16px system-ui;max-width:900px;margin:48px auto;padding:0 20px;color:#182433;background:#f5f7fa}button{font:inherit;padding:10px 16px;margin:5px;border:1px solid #8b9bad;border-radius:6px;background:white}button:disabled{opacity:.5}pre{padding:20px;background:#152536;color:#e4f2f8;border-radius:8px;white-space:pre-wrap}progress{width:100%;height:20px}.ok{color:#147843}</style></head>
<body><h1>Streaming artifact verification</h1><p>Download the generated 8 MiB trace into a new, explicitly selected origin-private folder. Check received bytes and read the saved file back in 64 KiB slices.</p>
<button id="run">Verify OPFS download</button><button id="worker">Verify in Worker</button><button id="cancel-test">Verify cancellation</button><button id="pick">Save to chosen file</button><button id="stop" disabled>Cancel transfer</button>
<progress id="progress" value="0" max="1"></progress><p id="status">Ready</p><pre id="output">Waiting for a test.</pre><script type="module" src="/browser.mjs"></script></body></html>

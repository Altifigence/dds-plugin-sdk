<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDK configuration example</title>
<script type="importmap">{"imports":{"@altifigence/dds-plugin-sdk":"/sdk/index.mjs","@altifigence/dds-plugin-sdk/settings":"/sdk/settings.mjs","@altifigence/dds-plugin-sdk/secrets":"/sdk/secrets.mjs","@altifigence/dds-plugin-sdk/data-schema":"/sdk/data-schema.mjs","@altifigence/dds-plugin-sdk/localization":"/sdk/localization.mjs","@altifigence/dds-plugin-sdk/accessibility":"/sdk/accessibility.mjs"}}</script>
<style>
:root{color-scheme:light;--backdrop:#f6f7fb;--main:#fff;--text:#17203a;--muted:#4b556b;--line:#bdc6d8;--accent:#493ab9}*{box-sizing:border-box}body{margin:0;background:var(--backdrop);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--muted)}h1{font-size:clamp(26px,4vw,38px);line-height:1.2;max-width:780px;overflow-wrap:anywhere;margin:20px 0 10px}h2{font-size:19px;margin:0 0 18px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;margin-top:28px}.card{min-width:0;background:var(--main);border:1px solid var(--line);border-radius:14px;padding:24px}.wide{grid-column:1/-1}label{display:block;margin:16px 0 6px;overflow-wrap:anywhere}input,select,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;background:var(--main);padding:10px 12px;max-width:100%}input:not([type=checkbox]),.field{width:100%}button{cursor:pointer;white-space:normal;overflow-wrap:anywhere}button:disabled{opacity:.65;cursor:wait}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8e7eff;outline-offset:3px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions{margin-top:18px}.hint{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.check{display:flex;align-items:flex-start;gap:8px}.check input{margin-top:6px}output,pre{display:block;overflow-wrap:anywhere;white-space:pre-wrap}pre{font:13px/1.5 ui-monospace,monospace;direction:ltr;text-align:left;border:1px solid var(--line);border-radius:8px;padding:14px}#result{min-height:32px;color:var(--text)}#error{color:#b1283c;min-height:24px;font-size:14px}html[data-theme=dark]{color-scheme:dark;--backdrop:#101625;--main:#192236;--text:#f0f3ff;--muted:#b8c4de;--line:#526080;--accent:#6254cc}html[data-theme=dark] #error{color:#ffb3c0}@media(max-width:680px){main{padding:22px 16px}.grid{grid-template-columns:1fr}.card{padding:20px}header .row{width:100%}h1{font-size:27px}}
</style>
</head>
<body><main>
<header><span class="eyebrow">DDS PLUGIN SDK · 0.12</span><div class="row"><label for="locale">Language / 언어</label><select id="locale"><option value="en">English</option><option value="ko">한국어</option><option value="ar">العربية</option><option value="en-XA">Long labels</option><option value="fr-CA">Français — English fallback</option></select><button id="theme" data-text="theme.toggle">Switch appearance</button></div></header>
<h1 data-text="plugin.name">Configuration example</h1><p data-text="page.lead"></p>
<div class="grid">
<section class="card"><h2 data-text="settings.title"></h2><p id="settings-help" class="hint" data-text="settings.help"></p>
<label id="multiplier-label" for="multiplier"></label><input id="multiplier" type="number" min="1" max="10" value="2" aria-describedby="settings-help">
<label for="scope" data-text="settings.scope"></label><select id="scope" class="field"><option value="workspace" data-text="settings.workspace"></option><option value="user" data-text="settings.user"></option></select>
<div class="row actions"><button id="save" data-text="settings.save"></button><button id="reset" data-text="settings.reset"></button></div><p id="effective" class="hint"></p>
<label for="format" data-text="settings.format"></label><output id="format">summary-v1</output>
<label data-text="settings.token"></label><p id="reference-state" class="hint"></p><div class="row"><button id="revoke" data-text="reference.revoke"></button><button id="renew" data-text="reference.renew"></button></div>
</section>
<section class="card"><h2 data-text="command.title"></h2><p id="command-help" class="hint" data-text="command.help"></p>
<label id="names-label" for="names"></label><input id="names" value="Ada, 한글" aria-describedby="names-help"><p id="names-help" class="hint"></p>
<label for="mode" data-text="input.mode"></label><select id="mode" class="field"><option value="short" data-text="input.short"></option><option value="detailed" data-text="input.detailed"></option></select>
<label class="check"><input id="hold" type="checkbox"><span data-text="execution.hold"></span></label>
<div class="row actions"><button id="run" class="primary" aria-describedby="command-help"></button><button id="continue" hidden data-text="execution.continue"></button></div>
<p id="error" role="alert"></p><output id="result" role="status" aria-live="polite"></output><pre id="receipt" aria-label="Command result"></pre>
</section>
<section class="card wide"><h2 data-text="audit.title"></h2><p id="audit" class="hint"></p><p id="fallback" class="hint"></p><h2 data-text="literal.title"></h2><output id="literal" data-text="literal.sample"></output></section>
</div></main><script type="module" src="/browser.mjs"></script></body></html>

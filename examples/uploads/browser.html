<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DDS selected-file upload example</title>
<style>body{font:16px system-ui;max-width:960px;margin:48px auto;padding:0 24px;background:#f4f6f8;color:#152532}h1{font-size:30px}button,input{font:inherit;margin:6px 8px 6px 0;padding:9px 14px}button{cursor:pointer}pre{background:#fff;border:1px solid #ccd6df;border-radius:8px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%;height:24px}#status{font-weight:700}.ok{color:#146435}</style>
<h1>Selected-file upload and verified download</h1><p>Use a disposable file or the generated 2 MiB sample. The local SDK host stages it privately. Cancel after one saved chunk, reconnect, resume, commit, then verify a browser OPFS download.</p>
<label for="selected">Choose input file</label><input id="selected" type="file"><button id="sample">Use generated sample</button><p id="selection">No file selected</p>
<button id="cancel" disabled>Cancel after first chunk</button><button id="resume" disabled>Resume, commit and verify</button><button id="stop">Stop fixture and clean up</button>
<p id="status">Ready</p><progress id="progress" value="0" max="1"></progress><pre id="output" aria-live="polite">Choose a file to begin.</pre>
<script type="module" src="/browser.mjs"></script></html>
